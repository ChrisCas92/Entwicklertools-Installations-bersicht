lab.feature.enabled=true
lab.feature.timeout=PT3S
lab.feature.aliases=alpha,beta,gamma
lab.feature.weights.critical=10
lab.feature.weights.warning=5

%dev.lab.feature.enabled=false
%dev.lab.feature.owner=dev-team

lab.docs.enabled=true
lab.docs.service-name=docs-catalog
lab.docs.timeout=PT12S
lab.docs.page-size=250
lab.docs.retry.enabled=true
lab.docs.retry.max-attempts=5
lab.docs.retry.backoff=PT750MS
lab.docs.security.mode=mtls
lab.docs.security.api-key=dev-secret-key
lab.docs.security.allowed-roles=admin,ops,auditor
lab.docs.endpoints.catalog.url=https://api.example.local/catalog
lab.docs.endpoints.catalog.connect-timeout=PT3S
lab.docs.endpoints.catalog.read-timeout=PT6S
lab.docs.endpoints.catalog.method=GET
lab.docs.endpoints.orders.url=https://api.example.local/orders
lab.docs.endpoints.orders.connect-timeout=PT4S
lab.docs.endpoints.orders.read-timeout=PT7S
lab.docs.endpoints.orders.method=POST

# extra Quarkus configuration examples to enrich generated preview docs
quarkus.application.name=config-doc-lab
quarkus.application.version=1.0.0
quarkus.banner.enabled=false
quarkus.http.host=0.0.0.0
quarkus.http.port=8085
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000,https://example.com
quarkus.http.limits.max-body-size=15M
quarkus.log.level=INFO
quarkus.log.console.json=false
quarkus.log.category."com.example".level=DEBUG
quarkus.thread-pool.max-threads=32
quarkus.thread-pool.queue-size=256
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/lab
quarkus.datasource.username=lab_user
quarkus.datasource.password=lab_password
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.cache.caffeine."products".initial-capacity=50
quarkus.cache.caffeine."products".maximum-size=2000
quarkus.cache.caffeine."products".expire-after-write=30M
quarkus.smallrye-openapi.info-title=Config Doc Lab API
quarkus.smallrye-openapi.info-version=1.0
quarkus.swagger-ui.always-include=true
quarkus.micrometer.enabled=true
quarkus.health.openapi.included=true

%test.quarkus.hibernate-orm.enabled=false
%test.quarkus.datasource.jdbc=false
%test.quarkus.datasource.devservices.enabled=false
%dev.quarkus.hibernate-orm.enabled=false
%dev.quarkus.datasource.jdbc=false
%dev.quarkus.datasource.devservices.enabled=false
